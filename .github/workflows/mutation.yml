---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - '.gitattributes'
      - '.gitignore'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'README.md'

  push: *ignore-paths

name: mutation test

permissions:
  contents: read

jobs:
  mutation:
    uses: yii2-framework/actions/.github/workflows/infection.yml@f0e06ea5cc965cff4431177d448add7b7c98668b # v2.0.1
    with:
      composer-version: '2.10.3'
      extensions: mbstring, dom, zlib
      php-version: '["8.3"]'
    secrets:
      STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
